[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plantcontrol"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "systemlord", email = "systemlord@gulliversoft.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "paho-mqtt>=2.1.0",
]

[project.scripts]
plantcontrol = "plantcontrol.__main__:main"

[project.urls]
Documentation = "https://github.com/systemlord/plantcontrol#readme"
Issues = "https://github.com/systemlord/plantcontrol/issues"
Source = "https://github.com/systemlord/plantcontrol"

[tool.hatch.version]
path = "src/plantcontrol/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/plantcontrol tests}"

[tool.hatch.envs.test]
dependencies = [
  "pytest>=8.3.0",
]

[tool.hatch.envs.test.scripts]
test = "pytest -q"

[tool.coverage.run]
source_pkgs = ["plantcontrol", "tests"]
branch = true
parallel = true
omit = [
  "src/plantcontrol/__about__.py",
]

[tool.coverage.paths]
plantcontrol = ["src/plantcontrol", "*/plantcontrol/src/plantcontrol"]
tests = ["tests", "*/plantcontrol/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
